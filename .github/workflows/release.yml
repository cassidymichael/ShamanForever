name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Package and release
        uses: BigWigsMods/packager@v2
        env:
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
          # CurseForge project 1706929 (## X-Curse-Project-ID in the TOC).
          # The project's own "Automatic Packaging" is disabled on purpose: it also
          # fires on new tags, so leaving it on would put two files on every release.
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          # Wago and WoWInterface are not set up yet; add the secret and the matching
          # X-Wago-ID / X-WoWI-ID field in the TOC to start publishing there.
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
          WOWI_API_TOKEN: ${{ secrets.WOWI_API_TOKEN }}
